name: Deploy site to GitHub Pages

# Publishes the front-end to GitHub Pages.
# The whole repo root is uploaded so the page can read the
# daily-updated benchmarks.json sitting alongside it.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'benchmarks.json'
      - '.github/workflows/deploy-pages.yml'
  # Re-publish after the daily scraper updates prices
  workflow_run:
    workflows: ['Daily Price Update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload repo root so the site and benchmarks.json ship together
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
